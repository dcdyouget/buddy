[package]
name = "buddy"
version = "1.0.0"
description = "Buddy - AI Chat Assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "buddy_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "native-tls-vendored", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
tauri-plugin-global-shortcut = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures-util = "0.3"
arboard = "3"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
core-graphics = "0.23"
