name: OSS connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public OSS endpoint from GitHub runner
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://buddy-release.oss-cn-beijing.aliyuncs.com/buddy/channels/stable.json', {
            headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`OSS endpoint returned HTTP ${response.status}`);
          const manifest = await response.json();
          if (!manifest.version) throw new Error('OSS response has no version');
          console.log(`GitHub runner reached OSS; stable version: ${manifest.version}`);
          NODE
      - name: Upload probe and check public HEAD metadata
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/release/publish-ci-artifacts.mjs --probe
