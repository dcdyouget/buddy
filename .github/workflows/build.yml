name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tauri build -- --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-macos-aarch64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/

  build-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: rustup target add x86_64-apple-darwin
      - run: npm run tauri build -- --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-macos-x86_64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run tauri build -- --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: buddy-windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/
