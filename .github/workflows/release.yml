name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 完整发版或复用已有制品续发
        required: true
        default: release
        type: choice
        options:
          - release
          - resume
      build_run:
        description: 续发时填写原 Release 构建运行 ID
        required: false
        type: string
      version:
        description: "待发布版本号（例如 0.1.17，必须高于线上版本）"
        required: true
        type: string
      notes:
        description: "中文更新说明"
        required: true
        type: string

# Serialize the entire release, including the final stable-channel switch.
concurrency:
  group: buddy-stable-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.mode == 'release'
    name: Prepare version and verify OSS access
    # 凡是访问 OSS 的任务都跑在国内自建 runner 上（GitHub 托管 runner 到北京 OSS 的跨境链路
    # 只有几十 KB/s 且经常卡死）；探测在这里做，验证的就是真实上传路径。
    runs-on: [self-hosted, oss-publisher]
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check branch, inputs, and required secrets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          if (process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('请在 main 分支执行 Release');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.RELEASE_VERSION ?? '')) throw new Error('版本号必须为 主.次.修订');
          if (!process.env.RELEASE_NOTES?.trim()) throw new Error('更新说明不能为空');
          for (const name of ['SIGNING_KEY', 'OSS_ACCESS_KEY_ID', 'OSS_ACCESS_KEY_SECRET']) {
            if (!process.env[name]) throw new Error(`缺少 GitHub Secret: ${name === 'SIGNING_KEY' ? 'TAURI_SIGNING_PRIVATE_KEY' : name}`);
          }
          NODE

      - name: Check the publishing runner can upload to OSS and inspect public HEAD metadata
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/release/publish-ci-artifacts.mjs --probe

      - id: release
        name: Commit version and push immutable source tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B main "$GITHUB_SHA"
          node scripts/release/prepare-ci-release.mjs

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-15
            artifact: Buddy-darwin-aarch64
            artifact_path: macos/aarch64
          - platform: windows-x86_64
            runner: windows-2022
            artifact: Buddy-windows-x86_64
            artifact_path: windows/x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      COMMIT: ${{ needs.prepare.outputs.commit }}
      CARGO_BUILD_JOBS: 2
      SIGNING_ENABLED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1

      # rust-cache hashes every installed toolchain; exclude runner image tools.
      - name: Isolate pinned Rust toolchain
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/buddy-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: buddy-${{ matrix.platform }}-v1

      - name: Install NSIS Windows installer compiler
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test and package macOS Apple Silicon
        id: package_macos
        if: matrix.platform == 'darwin-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$COMMIT" ]]
          [[ "$(uname -m)" == "arm64" || "$(uname -m)" == "aarch64" ]] || {
            echo "macOS release runner is not Apple Silicon: $(uname -m)" >&2
            exit 1
          }
          cargo test --workspace --exclude buddy-markdown --locked
          MACOSX_DEPLOYMENT_TARGET=12.0 cargo build --release --locked -p buddy-app --bin buddy
          out=".release/$VERSION/macos/aarch64"
          scripts/release/bundle-macos.sh "$VERSION" target/release/buddy "$out"

      - name: Test and package Windows x64
        id: package_windows
        if: matrix.platform == 'windows-x86_64'
        shell: powershell
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:COMMIT) { throw "checked out commit does not match validated release source" }
          ./scripts/windows-dev.ps1 -Action test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-dev.ps1 -Action build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/release/bundle-windows.ps1 -Version $env:VERSION -OutDir ".release/$env:VERSION/windows/x86_64"
          ./scripts/release/test-windows-installer.ps1 -Setup ".release/$env:VERSION/windows/x86_64/Buddy_$($env:VERSION)_x86_64_setup.exe" -AppName Buddy -AppId Buddy

      # Tag and manual-dispatch runs are trusted repository workflows. No pull
      # request event is accepted, and a missing secret deliberately leaves the
      # artifacts unsigned for the local release process to sign.
      - name: Install signer
        if: env.SIGNING_ENABLED == 'true'
        run: npm ci

      - name: Sign macOS artifacts when an update key is configured
        if: matrix.platform == 'darwin-aarch64' && env.SIGNING_ENABLED == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/buddy-updater.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$key"
          unset TAURI_SIGNING_PRIVATE_KEY
          for asset in \
            ".release/$VERSION/macos/aarch64/Buddy_${VERSION}_aarch64.app.tar.xz" \
            ".release/$VERSION/macos/aarch64/Buddy_${VERSION}_aarch64.dmg"; do
            node_modules/.bin/tauri signer sign -f "$key" "$asset" </dev/null
            cargo run --locked -p buddy-update --example verify-artifact -- "$asset" "$asset.sig"
          done

      - name: Sign Windows artifacts when an update key is configured
        if: matrix.platform == 'windows-x86_64' && env.SIGNING_ENABLED == 'true'
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./scripts/windows-env.ps1
          $ErrorActionPreference = 'Continue'
          $key = Join-Path $env:RUNNER_TEMP "buddy-updater.key"
          try {
            [IO.File]::WriteAllText($key, $env:TAURI_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
            $env:TAURI_SIGNING_PRIVATE_KEY = $null
            $assets = @(
              ".release/$env:VERSION/windows/x86_64/Buddy_$($env:VERSION)_x86_64.exe",
              ".release/$env:VERSION/windows/x86_64/Buddy_$($env:VERSION)_x86_64_setup.exe",
              ".release/$env:VERSION/windows/x86_64/Buddy_$($env:VERSION)_x86_64.zip"
            )
            foreach ($asset in $assets) {
              & .\node_modules\.bin\tauri.cmd signer sign -f $key $asset
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              cargo run --locked -p buddy-update --example verify-artifact -- $asset "$asset.sig"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
          }

      - name: Upload platform artifact
        if: always() && !cancelled() && (steps.package_macos.outcome == 'success' || steps.package_windows.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-v${{ needs.prepare.outputs.version }}
          path: |
            .release/${{ needs.prepare.outputs.version }}/${{ matrix.artifact_path }}/Buddy_*.app.tar.xz*
            .release/${{ needs.prepare.outputs.version }}/${{ matrix.artifact_path }}/Buddy_*.dmg*
            .release/${{ needs.prepare.outputs.version }}/${{ matrix.artifact_path }}/Buddy_*.exe*
            .release/${{ needs.prepare.outputs.version }}/${{ matrix.artifact_path }}/Buddy_*.zip*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish both platforms to OSS and GitHub Release
    needs: [prepare, build]
    runs-on: [self-hosted, oss-publisher]
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_NOTES: ${{ inputs.notes }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      GH_TOKEN: ${{ github.token }}
      # 自建 runner 的家目录是持久卷：工具链与校验程序的编译产物留在工作区之外，
      # checkout 清理工作区时不会丢，下次发版增量编译。
      CARGO_TARGET_DIR: /home/runner/.cache/buddy-verifier-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-darwin-aarch64-v${{ needs.prepare.outputs.version }}
          path: .release/${{ needs.prepare.outputs.version }}/macos/aarch64
      - uses: actions/download-artifact@v4
        with:
          name: Buddy-windows-x86_64-v${{ needs.prepare.outputs.version }}
          path: .release/${{ needs.prepare.outputs.version }}/windows/x86_64
      - name: Verify, upload, check public HEAD metadata, and switch stable channel
        run: node scripts/release/publish-ci-artifacts.mjs

  resume:
    name: Resume verified publication
    if: inputs.mode == 'resume'
    permissions:
      contents: write
      actions: read
    runs-on: [self-hosted, oss-publisher]
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.notes }}
      BUILD_RUN: ${{ inputs.build_run }}
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      GH_TOKEN: ${{ github.token }}
      CARGO_TARGET_DIR: /home/runner/.cache/buddy-verifier-target
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate original release source and save current publisher
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, copyFileSync } from 'node:fs';
          if (process.env.GITHUB_REF !== 'refs/heads/main') throw new Error('请在 main 执行');
          const version = process.env.RELEASE_VERSION;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version ?? '')) throw new Error('版本号无效');
          if (!/^[0-9]+$/.test(process.env.BUILD_RUN ?? '')) throw new Error('构建运行 ID 无效');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commit = git('rev-parse', `v${version}^{}`);
          const run = JSON.parse(execFileSync('gh', ['api', `repos/dcdyouget/buddy/actions/runs/${process.env.BUILD_RUN}`], { encoding: 'utf8' }));
          if (run.path !== '.github/workflows/release.yml' || run.event !== 'workflow_dispatch' || run.status !== 'completed') throw new Error('必须使用已结束的 Release 构建运行');
          if (run.head_sha !== commit && run.head_sha !== git('rev-parse', `${commit}^`)) throw new Error('构建运行与版本源码不匹配');
          const jobs = JSON.parse(execFileSync('gh', ['api', `repos/dcdyouget/buddy/actions/runs/${process.env.BUILD_RUN}/jobs`], { encoding: 'utf8' })).jobs;
          for (const platform of ['darwin-aarch64', 'windows-x86_64']) {
            if (!jobs.some(job => job.name === platform && job.conclusion === 'success')) throw new Error(`${platform} 构建未成功`);
          }
          copyFileSync('scripts/release/publish-ci-artifacts.mjs', `${process.env.RUNNER_TEMP}/publish-ci-artifacts.mjs`);
          copyFileSync('scripts/release/oss-multipart.mjs', `${process.env.RUNNER_TEMP}/oss-multipart.mjs`);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_COMMIT=${commit}\n`);
          git('checkout', '--detach', commit);
          NODE
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: Buddy-darwin-aarch64-v${{ inputs.version }}
          path: .release/${{ inputs.version }}/macos/aarch64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: Buddy-windows-x86_64-v${{ inputs.version }}
          path: .release/${{ inputs.version }}/windows/x86_64
      - name: Resume verified artifact publication
        run: node "$RUNNER_TEMP/publish-ci-artifacts.mjs"
