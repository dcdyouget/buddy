# GitHub Actions: 多平台构建 + 自动 Release
#
# 触发：
#   - 推送 v* tag（如 v1.0.0）→ 自动构建并创建 GitHub Release
#   - Actions 页面手动 Run workflow → 仅构建 + 上传 artifacts，不发版
#
# 产物（每平台一份）：
#   macOS:   .app + .dmg
#   Windows: NSIS .exe + MSI .msi
#   Linux:   .deb + .AppImage (+ .rpm)

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 创建 GitHub Release 需要

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Install macOS deps
        if: matrix.platform == 'macos-latest'
        run: |
          # Tauri 2 在 macOS 上不需要额外系统依赖

      # ── tauri-action 是关键 ──
      # 自动跳过 publish（如配置 updater 而无签名时也不会爆）
      - name: Build & Upload
        uses: tauri-apps/tauri-action@v0
        env:
          # 如果要自动 Release，把 GITHUB_TOKEN 已默认注入
          # 如果有代码签名证书，在这里用：
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}  # macOS only
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.0-{0}', github.run_id) }}
          releaseName: 'Buddy v__VERSION__'
          releaseBody: |
            ## 下载对应平台安装包

            - **macOS**: 下载 `.dmg` 或 `.app`
            - **Windows**: 下载 `Buddy_*_x64-setup.exe`（推荐）或 `.msi`
            - **Linux**: 下载 `.deb`（Debian/Ubuntu）或 `.AppImage`（通用）
          releaseDraft: true
          prerelease: false
          # 不自动 includeUpdaterJson，避免没配 updater 时出错
          includeUpdaterJson: false
