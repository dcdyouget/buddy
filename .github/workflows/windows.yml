name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建并打包的 Git ref（分支、标签或提交 SHA）
        required: true
        default: main
        type: string

jobs:
  windows-x64:
    runs-on: windows-2022
    env:
      # Match the release job's environment hash for shared dependency caches.
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # rust-cache hashes every installed toolchain; exclude runner image tools.
      - name: Isolate pinned Rust toolchain
        shell: bash
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/buddy-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: buddy-windows-x86_64-v1
          # Only full builds save both test and release profiles. A check-only
          # cache would occupy the immutable key without release dependencies.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}
      - name: 检查 Windows 编译与测试
        shell: powershell
        run: |
          ./scripts/windows-dev.ps1 -Action check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/windows-dev.ps1 -Action test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release/manifest.test.mjs
          exit $LASTEXITCODE
      - name: 安装 NSIS 编译器
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue) -and -not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: 构建 Windows 安装器和便携包
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          ./scripts/windows-dev.ps1 -Action build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -eq 'buddy-app').version
          ./scripts/release/bundle-windows.ps1 -Version $version
          ./scripts/release/test-windows-installer.ps1 -Setup ".release/$version/windows/x86_64/Buddy_${version}_x86_64_setup.exe" -AppName Buddy -AppId Buddy
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Buddy-windows-x86_64
          path: |
            .release/*/windows/x86_64/Buddy_*.exe
            .release/*/windows/x86_64/Buddy_*.zip
          if-no-files-found: error
