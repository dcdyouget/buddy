[package]
name = "buddy-syntax"
version.workspace = true
edition.workspace = true
publish = false
# MIT —— 移植自 Comet（~/Project/comet，crates/syntax，commit a4781608），原许可证见 LICENSE-MIT-comet
license = "MIT"
description = "tree-sitter 语法高亮（移植自 Comet 的 zeron-syntax，MIT）。无 UI 依赖。"

[dependencies]
thiserror.workspace = true
tree-sitter = "=0.26.11"
tree-sitter-highlight = "=0.26.11"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-bash = { version = "=0.25.1", optional = true }
tree-sitter-toml-ng = { version = "=0.7.0", optional = true }
tree-sitter-md = "=0.5.3"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = { version = "=0.23.5", optional = true }
tree-sitter-java = { version = "=0.23.5", optional = true }
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.3"
tree-sitter-ruby = { version = "=0.23.1", optional = true }
tree-sitter-php = { version = "=0.24.2", optional = true }
tree-sitter-sequel = "=0.3.11"
tree-sitter-lua = { version = "=0.5.0", optional = true }
tree-sitter-nix = { version = "=0.3.0", optional = true }
tree-sitter-make = { version = "=1.1.1", optional = true }
tree-sitter-containerfile = { version = "=0.9.2", optional = true }

[features]
# v1 无高亮的 10 种语言（S04-03：静态解析表约 12 MB，AGENTS.md 安装包目标 < 10 MB）。
# 2026-09-27 用户决定启用：buddy-markdown 打开本 feature，language_stub 已放行对应语言。
extra-languages = [
    "dep:tree-sitter-bash",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-c-sharp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-ruby",
    "dep:tree-sitter-php",
    "dep:tree-sitter-lua",
    "dep:tree-sitter-nix",
    "dep:tree-sitter-make",
    "dep:tree-sitter-containerfile",
]

[dev-dependencies]
# Comet 原有测试覆盖全部语言 → 测试构建时打开 extra-languages，保持原测试集不缩水
buddy-syntax = { path = ".", features = ["extra-languages"] }
