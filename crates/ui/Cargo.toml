[package]
name = "buddy-ui"
version.workspace = true
edition.workspace = true
publish = false
# GPL-3.0-or-later —— 因为依赖 zed 的 theme / ui（其 license 字段如此声明）
license = "GPL-3.0-or-later"
description = "Buddy 界面层：GPUI 组件、主题、窗口外壳。"

[dependencies]
# GPUI 与 zed 的界面层（Apache-2.0 平台层 + GPL 主题/组件层）
gpui.workspace = true
gpui_platform.workspace = true
theme.workspace = true
ui.workspace = true
gpui_tokio.workspace = true

# vendored zed markdown（GPL，S04-01）
buddy-markdown.workspace = true

# 引擎层（MIT）—— 注意依赖方向：UI 依赖 engine，反向不允许
buddy-engine.workspace = true

log.workspace = true
# chat_bridge：engine 事件通道（tokio mpsc）
tokio.workspace = true
# http：GPUI 图片加载的 HTTP 客户端（与 engine 同一 reqwest，不新增包）
reqwest.workspace = true
anyhow.workspace = true
# markdown::streaming：定位流式尾段中的可见字符（与 vendored markdown 同一解析器，已在闭包中）
pulldown-cmark.workspace = true
# chat::state：工具参数是否为完整 JSON 对象（v1 同一判定）
serde_json.workspace = true
# text_area：字形 / 词边界
unicode-segmentation.workspace = true
# 消息时间按本地时区格式化（S05-14）；engine 已依赖，不新增包
chrono.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc.workspace = true

[dev-dependencies]

[lints.rust]
# objc 0.2 的 `msg_send!` 宏展开含 `cfg(feature = "cargo-clippy")`（accessibility.rs）；
# 仅声明这一个取值为预期，其余 unexpected_cfgs 照常告警
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
